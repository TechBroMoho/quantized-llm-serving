[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmbench"
version = "0.1.0"
description = "Reproducible quantized LLM serving benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "modal==1.3.3",
]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
