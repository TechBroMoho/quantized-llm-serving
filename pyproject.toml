[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llmbench"
version = "0.1.0"
description = "Reproducible quantized LLM serving benchmarks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "fastapi==0.117.1",
    "modal==1.3.3",
    "pyyaml==6.0.3",
    "safetensors==0.6.2",
    "torch==2.8.0",
    "transformers==4.56.2",
    "uvicorn==0.36.0",
]

[project.scripts]
llmbench = "llmbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llmbench"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

# The quantization and eval stacks live in their own pinned envs
# (requirements/quantize.in, requirements/eval.in).
[[tool.mypy.overrides]]
module = ["llmcompressor", "llmcompressor.*", "datasets", "lm_eval", "lm_eval.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
