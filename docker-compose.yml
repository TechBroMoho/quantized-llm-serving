# Serve one checkpoint (BF16, AWQ or GPTQ) with the project's vLLM image on a
# local NVIDIA GPU. The model is a local directory mounted read-only, so the
# served weights are exactly the ones you downloaded (README, "Run it locally"):
#   MODEL_DIR=checkpoints/qwen3-8b-awq SERVED_MODEL_NAME=qwen3-8b-awq \
#     docker compose up --build
# The engine flags default to the Phase 6 benchmark's (configs/phase6_bench.yaml).
services:
  vllm:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: llmbench-vllm:v0.10.2
    ports:
      - "8000:8000"
    ipc: host
    environment:
      HF_HUB_OFFLINE: "1"  # everything comes from MODEL_DIR; never reach the Hub
      VLLM_NO_USAGE_STATS: "1"
    volumes:
      - type: bind  # long form: a relative MODEL_DIR is never read as a named volume
        source: ${MODEL_DIR:?set MODEL_DIR to a local checkpoint directory}
        target: /model
        read_only: true
    command:
      - --model
      - /model
      - --served-model-name
      - ${SERVED_MODEL_NAME:-qwen3-8b}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --dtype
      - bfloat16
      - --max-model-len
      - ${MAX_MODEL_LEN:-1024}
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.90}
      - --max-num-seqs
      - ${MAX_NUM_SEQS:-256}
      - --seed
      - "0"
      - --no-enable-prefix-caching
      - --generation-config
      - vllm
    healthcheck:
      # The base image has Python but not curl.
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 600s  # weight loading + CUDA graph capture
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
